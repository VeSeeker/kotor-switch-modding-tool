          - {label: Switch Patch, url: "https://www.mediafire.com/file/ilpo07v3a7nmliu/TSLRCM_Switch_Patch.zip/file"}
        method: ["Executable", Loose-file]
        install: |
          After installing the mod, replace dialog.tlk in `K2romfs` with the one linked above. Then extract the 2 .bik files from the Switch Patch into `K2romfs/Movies/`

      - id: tslrcm-tweak-pack
