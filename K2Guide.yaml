      - id: k2-cutscenes-rescaled
        type: mod
        title: K2 Cutscenes Rescaled
        author: Pops Maellard
        downloads:
          - {label: Mod, url: "https://deadlystream.com/files/file/2503-k2-cutscenes-rescaled/"}
        method: ["Loose-file"]
        download_instructions: |
          Choose the resolution option which most closely fits your monitor's screen size during the download process. If using TSLRCM or Extended Enclave, download both the main file most closely corresponding to your monitor resolution as well as the file of the same resolution with "_mods" appended to the filename (for instance, k2rs_30fps_1920x1080.7z and k2rs_30fps_mods_1920x1080.7z).
        install: |
          When installing, there will be several optional files based on how dialogue in cutscenes are displayed (floating text or not, etc). Which of these you choose is your preference; use the mod screenshots to determine. Install the main module first, then open the "mods" version of the file and apply the upscaled cutscenes for any mods which you use from the main build list. Bear in mind that the files from this mod go in your movies folder, not override. If you experience issues with the game minimizing during cutscenes, it might be necessary to go to [this video](https://www.youtube.com/watch?v=l7euNu1Tt5E) and follow the instructions to use RAD tools to "upscale" the cutscenes to match your exact resolution, though I have not personally attempted this so I don't know how much time it would take to complete. I would estimate around 8 hours, which is the typical time it takes for the native movies to be scaled to 1920x1080 using the same system, but remember that this would be a fully-automated process.

