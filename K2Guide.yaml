title: Kotor 1 Switch Modding Guide
author: VeSeeker

sections:
  - id: intro
    title: Introduction
    subtitle: You don't have to read this, but you may have questions if you don't
    body: |
      This guide is based on the neocities [KOTOR 1 Full Build for PC](https://kotor.neocities.org/modding/mod_builds/k1/full).

      Some modules get extremely close to the VRAM limit, so follow this guide closely. See {{ref:vram}}.
  - id: setup
    title: Setup
    subtitle: You really do need to read this part
    body: |
      This is the setup section.
    children:
      - id: tools
        title: Tools
        body: |
          This is the tools body
        children:
          - id: ksmt
            title: Kotor Switch Modding Tool
            body: |
              I made this cool tool
          - id: tslpatcher
            title: Fixing TSLPatcher automatic installation detection
            body: |
              Fix that tool
  - id: mods
    title: Mods
    children:
      - id: switch-texture-restoration
        type: mod
        title: Switch Texture Restoration
        author: jacqylfrost
        downloads:
          - {label: Mod, url: "https://deadlystream.com/files/file/2103-kotor-switch-texture-restoration"}
        method: [Loose-file]
        install: Extract the texture files into override, not a subfolder

      - id: character-startup
        type: mod
        title: Character Startup Changes & Patch
        author: jonathan7, patch by A Future Pilot
        downloads:
          - {label: Mod, url: "http://deadlystream.com/files/file/349-character-start-up-change/"}
          - {label: Patch, url: "https://mega.nz/file/sRw1GBIK#J8znLBwR6t7ZvZnpQbsUBYcUNfPCWA7wYNW3qU6gZSg"}
        method: [TSLPatcher, Loose-file]
        install: |
          Run TSLPatcher first, then copy the loose files into override.

      - id: 4gb-patcher
        type: mod
        title: 4GB Patcher
        author: Daniel Pistelli
        downloads:
          - {label: Patch, url: "https://ntcore.com/?page_id=371"}
        method: ["Executable"]
        install: |
          This step should only be performed if you are NOT on the Aspyr patch and have not applied J's 3C-FD patcher! 3C-FD applies this as part of its fixes to the Aspyr version. Just like 3C-FD, since the Mac Appstore version is not an executable, this program cannot be utilized on the Mac Appstore edition of the game.

      - id: tslrcm
        type: mod
        title: TSLRCM
        author: zbyl2, DarthStoney, Hassat Hunter & VarsityPuppet
        downloads:
          - {label: Mod, url: "https://deadlystream.com/files/file/578-tsl-restored-content-mod/"}
        method: ["Executable"]

      - id: tslrcm-tweak-pack
        type: mod
        title: TSLRCM Tweak Pack
        author: Pavijan (update by Fair Strides)
        downloads:
          - {label: Mod, url: "http://deadlystream.com/files/file/296-unofficial-tslrcm-tweak-pack/"}
        method: ["Multi-Run TSLPatcher"]
        install: |
          Don't use the complete installer, instead selecting the individual component installer—this is critical for compatibility, not just to choose specific options. The installer for this mod will need to be run 6 times, once to install each of the options we'll be using: Kaevee Removal Parts 1 & 2, Saedhe's Head, Kreia-Atris Dialogue Tweak, Trayus Mandalore Conversation, and Trayus Sith Lord Masks. Most of the other options for this mod are untested with the mod builds, but will likely function--I still recommend against using them, since compatibility isn't 100% guaranteed, but you can try. The one exception is Atton at the End, which is completely incompatible with one of the most important mods in this build, which is a much more comprehensive implementation of Atton's dialogue at endgame.

      - id: silent-sion
        type: mod
        title: Silent Sion
        author: Emperor Devon
        downloads:
          - {label: Mod, url: "https://deadlystream.com/files/file/2426-silent-sion-restoration/"}
        method: ["Loose-File"]
        install: |
          Move just 153sion.dlg to the override.

      - id: thematic-kotor-2-companions
