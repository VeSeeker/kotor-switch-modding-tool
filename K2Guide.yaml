        author: Rovan
        downloads:
          - {label: Mod, url: "http://deadlystream.com/files/file/828-tsl-prestige-class-saving-throw-fixes/"}
        method: ["Loose-file"]
        install: |
          I advise users to only install the Jedi Master/Sith Lord fixes.

      - id: classic-class-attack
        type: mod
        title: Classic Class Attack
        author: Crimson Knight
        downloads:
          - {label: Mod, url: "https://deadlystream.com/files/file/2812-classic-class-attack-bonus/"}
        method: ["TSLPatcher"]
        install: |
          Strongly recommend downloading the standard option. Weaker Consulars can be extremely punishing, so if you choose this option be aware that you're in for a rough time at some places!

